# Railway: Python Binance bridge (trading engine) — always-on
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# Never sleep — Binance WS + scanner must stay live
numReplicas = 1
