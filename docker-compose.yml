services:
  binance-api:
    build: .
    container_name: bilshenz-binance-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8766:8766"
    volumes:
      - ./logs:/var/log/bilshenz
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8766/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "0.9"

  desk-api:
    image: node:20-bookworm-slim
    container_name: bilshenz-desk-api
    restart: unless-stopped
    working_dir: /app/backend
    env_file:
      - .env
    command: ["npx", "tsx", "src/server.ts"]
    ports:
      - "8791:8791"
    volumes:
      - ./backend:/app/backend
      - ./logs:/var/log/bilshenz
    depends_on:
      binance-api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
