services:
  binance-api:
    build: .
    container_name: bilshenz-binance-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BINANCE_SESSION_FILE: /data/binance-session.json
      SCANNER_RISK_CONFIG_PATH: /data/scanner-risk.json
      LOG_DIR: /data/logs
    ports:
      - "8766:8766"
    volumes:
      - bilshenz-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8766/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  desk-api:
    build:
      context: .
      dockerfile: deploy/railway/Dockerfile.desk
    container_name: bilshenz-desk-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BINANCE_API_URL: http://binance-api:8766
      AUTH_DATA_DIR: /data/auth
      DESK_API_PORT: "8791"
    ports:
      - "8791:8791"
    volumes:
      - bilshenz-data:/data
    depends_on:
      binance-api:
        condition: service_healthy

volumes:
  bilshenz-data:
